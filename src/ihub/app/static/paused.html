<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session paused · iHub Data Analytics Platform</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #f6f7f9; color: #1f2933; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { line-height: 1.5; color: #52606d; }
    a.button { display: inline-block; margin-top: 1rem; padding: 0.7rem 1.4rem;
               border-radius: 0.5rem; background: #1f6feb; color: #fff;
               text-decoration: none; font-weight: 600; }
    a.button:hover { background: #1858c4; }
  </style>
</head>
<body>
  <main>
    <h1>Session paused</h1>
    <p>This page was idle for a while, so it was paused to keep the iHub
       Data Analytics Platform free to run. Nothing was lost.</p>
    <a class="button" id="continue" href="/">Continue</a>
  </main>
  <script>
    const back = new URLSearchParams(location.search).get("return");
    if (back && back.startsWith("/") && !back.startsWith("//")) {
      document.getElementById("continue").href = back;
    }
  </script>
</body>
</html>

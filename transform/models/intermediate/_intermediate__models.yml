version: 2

models:
  - name: int_publications__source_records
    description: >
      Every publication record from every source in one common shape, with the
      publication_key it resolves to. The link from a publication back to each source record.
    columns:
      - name: publication_key
        description: Surrogate key of the de-duplicated publication this record belongs to.
        data_tests:
          - not_null
      - name: match_rule
        description: How the record was matched (doi, title_year_to_doi, title_year or single_record).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [doi, title_year_to_doi, title_year, single_record]
      - name: source_system
        description: Source the record came from, e.g. openalex.
        data_tests:
          - not_null
      - name: source_record_id
        description: The record's identifier in its own source.
        data_tests:
          - not_null
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_system, source_record_id]

  - name: int_publications__deduplicated
    description: One row per de-duplicated publication.
    columns:
      - name: publication_key
        data_tests:
          - unique
          - not_null
      - name: year
        data_tests:
          - not_null
      - name: n_source_records
        data_tests:
          - not_null

  - name: int_authors__source_records
    description: >
      Every author record from every source, with the author_key it resolves to. Authors
      match on ORCID iD first, then OpenAlex author ID; name-only records stay unmatched.
    columns:
      - name: author_key
        data_tests:
          - not_null
      - name: match_rule
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [orcid, openalex_id_to_orcid, openalex_id, single_record]
      - name: source_system
        data_tests:
          - not_null
      - name: source_record_id
        data_tests:
          - not_null
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_system, source_record_id]

  - name: int_authors__deduplicated
    description: One row per de-duplicated author.
    columns:
      - name: author_key
        data_tests:
          - unique
          - not_null
      - name: n_source_records
        data_tests:
          - not_null

  - name: int_publications__departments
    description: >
      The UNZA department-level units each publication is attributed to, with the evidence.
      Author-level evidence (OpenAlex affiliations, ORCID employments) names the author;
      publication-level evidence (IRIMS sets) leaves author_key empty. A publication with no
      row here is "Unassigned department" in the mart.
    columns:
      - name: publication_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_publications__deduplicated')
                field: publication_key
      - name: author_key
        description: Empty for publication-level evidence.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_authors__deduplicated')
                field: author_key
      - name: org_unit_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('unza_org_units')
                field: org_unit_id
      - name: evidence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [openalex_affiliation, orcid_employment, dspace_set]
    data_tests:
      - unique_combination:
          arguments:
            columns: [publication_key, author_key, org_unit_id, evidence]

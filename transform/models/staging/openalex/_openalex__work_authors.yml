version: 2

models:
  - name: stg_openalex__work_authors
    description: One row per OpenAlex work and author, in the order OpenAlex lists them.
    columns:
      - name: openalex_id
        data_tests: [not_null]
      - name: author_position
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [openalex_id, author_position]

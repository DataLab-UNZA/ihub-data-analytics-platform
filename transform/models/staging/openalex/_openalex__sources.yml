version: 2

sources:
  - name: raw_openalex
    description: OpenAlex works exactly as fetched by the OpenAlex connector.
    schema: raw_openalex
    tables:
      - name: records
        description: One row per OpenAlex work, with the API response in `payload`.
        columns:
          - name: record_id
            description: The OpenAlex work URL, e.g. https://openalex.org/W2548000951.
          - name: source
            description: Always "openalex".
          - name: fetched_at
            description: When the connector fetched the record (UTC).
          - name: payload
            description: The work as JSON, unchanged.

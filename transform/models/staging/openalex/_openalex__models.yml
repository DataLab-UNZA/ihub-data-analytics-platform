version: 2

models:
  - name: stg_openalex__works
    description: One row per OpenAlex work, renamed, typed and standardised.
    columns:
      - name: openalex_id
        description: OpenAlex work ID without the URL prefix, e.g. W2548000951.
        data_tests:
          - unique
          - not_null
      - name: title
        description: Title of the work. Can be empty in OpenAlex.
      - name: year
        description: Publication year.
        data_tests:
          - not_null
      - name: type
        description: OpenAlex work type, e.g. article, review, book-chapter.
        data_tests:
          - not_null
      - name: venue_id
        description: OpenAlex source ID of the primary venue, without the URL prefix.
      - name: venue_name
        description: Name of the primary venue (journal, repository or conference).
      - name: doi
        description: DOI in lower case, without the https://doi.org/ prefix. Empty if none.
      - name: is_oa
        description: Whether the work is open access.
        data_tests:
          - not_null
      - name: oa_status
        description: OpenAlex open-access status, e.g. gold, green, hybrid, bronze, closed.
      - name: cited_by_count
        description: Number of citations recorded by OpenAlex.
        data_tests:
          - not_null
      - name: n_authors
        description: Number of authorships listed (OpenAlex lists at most 100).
        data_tests:
          - not_null
      - name: fetched_at
        description: When the connector fetched the record (UTC).

# Cloud Run service definition, applied by .github/workflows/deploy.yml with
# `gcloud run services replace` after envsubst fills in the ${...} values.
#
# Two containers share one instance (ADR-007):
#   web  Next.js front end, the only container that receives traffic (port 8080)
#   api  FastAPI research API, a sidecar reached on localhost:8000, never public
# `web` starts after `api` passes its startup probe.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    commit-sha: "${REF}"
    data-tag: "${DATA_TAG}"
  annotations:
    # Keep the generated run.app URL reachable by users and by the deploy health check.
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
    ihub/commit: "${SHORT_REF}"
spec:
  template:
    metadata:
      labels:
        commit-sha: "${REF}"
        data-tag: "${DATA_TAG}"
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"web":["api"]}'
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: web
          image: ${WEB_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: IHUB_API_URL
              value: http://127.0.0.1:8000
            # Sign-in is required (ADR-010); users are kept in Firestore (ADR-009, ADR-016).
            - name: IHUB_REQUIRE_SIGN_IN
              value: "true"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
        - name: api
          image: ${API_IMAGE}
          env:
            - name: IHUB_REQUIRE_SIGN_IN
              value: "true"
            # Accounts live in a local SQLite file inside the app (ADR-018). It is erased when
            # Cloud Run replaces the instance; bootstrap administrators get their role back
            # at their next sign-in.
            - name: IHUB_ALLOW_EPHEMERAL_AUTH
              value: "true"
            - name: IHUB_AUTH_DB_PATH
              value: /tmp/ihub-auth.sqlite
            # Sign-in settings (Google OAuth, SMTP, auth secret), from GitHub secrets and
            # variables. deploy.yml writes one entry per value that is set, already quoted,
            # in place of the line below. See docs/DEPLOYMENT.md.
${API_AUTH_ENV}
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

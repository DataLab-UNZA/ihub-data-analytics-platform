name: Feature request
description: Propose a new feature, page, connector or data model
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
      description: Who needs this, and what question does it help them answer?
      placeholder: "As a research office manager, I want to see output per department per year so that..."
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Connector (ingestion)
        - Staging / intermediate (dbt)
        - Research mart (dbt)
        - Web app (Streamlit)
        - CI / deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, references or similar features in other platforms

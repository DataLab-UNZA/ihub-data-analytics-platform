name: Pipeline

# Runs the connectors and dbt, then publishes ihub.duckdb as a GitHub Release
# asset (data-YYYY-MM-DD). The deployed app downloads the newest asset at
# runtime, so new data appears without a redeploy.
# Weekly on Mondays at 02:00 UTC (04:00 in Lusaka), or by hand. See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-data:
    name: build-data
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the data release
    env:
      IHUB_DUCKDB_PATH: ${{ github.workspace }}/data/ihub.duckdb
      OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      OJS_API_TOKEN: ${{ secrets.OJS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (app + dbt)
        run: |
          uv python install 3.12
          uv sync --group pipeline

      - name: Run connectors
        run: uv run python -m ihub.ingest

      - name: Build marts (dbt)
        working-directory: transform
        run: uv run dbt build --profiles-dir .

      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" data/ihub.duckdb --clobber
          else
            gh release create "$tag" data/ihub.duckdb \
              --title "Data $(date -u +'%B %-d, %Y')" \
              --notes "DuckDB file built by the Pipeline workflow from commit ${GITHUB_SHA}. Public research metadata only." \
              --latest=false
          fi
          # Keep the five newest data releases.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

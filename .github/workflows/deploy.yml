name: Deploy

# Builds the two images of the web app (Next.js front end, and the research API
# with the newest data release built in) and deploys them to Google Cloud Run as
# one service with two containers (deploy/service.yaml, ADR-007). Runs on every merge to main that changes the app (after approval in the
# "production" environment), by hand (optionally for an older commit, to roll
# back) and from the Pipeline workflow after a data refresh.
# Authenticates with Workload Identity Federation: no keys are stored anywhere.
# See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    # Changes that cannot affect the running app do not ask for a production deploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"
      - "scripts/make_context_pack.py"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/context-pack.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to deploy (leave empty for the latest main; use an older commit to roll back)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy"
        required: true
        type: string
      environment:
        description: "GitHub environment for the deploy job"
        required: false
        type: string
        default: production

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE: ihub-app

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      REF: ${{ inputs.ref || github.sha }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ihub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Download the newest data release
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.createdAt) | last | .tagName // ""')"
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern ihub.duckdb --dir data
            echo "Using data release $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            tag="none"
            echo "No data release yet: deploying without data." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the images
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --file Dockerfile.api --tag "$REGISTRY/api:$REF" .
          docker build --tag "$REGISTRY/web:$REF" web
          docker push "$REGISTRY/api:$REF"
          docker push "$REGISTRY/web:$REF"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          DATA_TAG: ${{ steps.data.outputs.tag }}
          # Sign-in settings for the api container (ADR-010). Secrets come from the job's
          # environment ("production", or "pipeline" for the weekly redeploy), so add them
          # to both; the rest are repository variables. Unset values are left out.
          IHUB_AUTH_SECRET: ${{ secrets.IHUB_AUTH_SECRET }}
          IHUB_GOOGLE_CLIENT_SECRET: ${{ secrets.IHUB_GOOGLE_CLIENT_SECRET }}
          IHUB_SMTP_PASSWORD: ${{ secrets.IHUB_SMTP_PASSWORD }}
          IHUB_GOOGLE_CLIENT_ID: ${{ vars.IHUB_GOOGLE_CLIENT_ID }}
          IHUB_PUBLIC_URL: ${{ vars.IHUB_PUBLIC_URL }}
          IHUB_ALLOWED_EMAIL_DOMAIN: ${{ vars.IHUB_ALLOWED_EMAIL_DOMAIN }}
          IHUB_BOOTSTRAP_ADMINS: ${{ vars.IHUB_BOOTSTRAP_ADMINS }}
          IHUB_SMTP_HOST: ${{ vars.IHUB_SMTP_HOST }}
          IHUB_SMTP_PORT: ${{ vars.IHUB_SMTP_PORT }}
          IHUB_SMTP_USERNAME: ${{ vars.IHUB_SMTP_USERNAME }}
          IHUB_SMTP_FROM: ${{ vars.IHUB_SMTP_FROM }}
          IHUB_SMTP_SSL: ${{ vars.IHUB_SMTP_SSL }}
        run: |
          SHORT_REF="$(echo "$REF" | cut -c1-12)"
          API_IMAGE="$REGISTRY/api:$REF"
          WEB_IMAGE="$REGISTRY/web:$REF"
          # Google redirects sign-ins back to the app's own address, so default to it.
          if [ -z "$IHUB_PUBLIC_URL" ]; then
            IHUB_PUBLIC_URL="$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)' 2>/dev/null || true)"
          fi
          # One env entry per value that is set. jq quotes each value as a JSON string, which is
          # also valid YAML, so quotes or backslashes in a password cannot break the file.
          API_AUTH_ENV=""
          for name in IHUB_AUTH_SECRET IHUB_GOOGLE_CLIENT_ID IHUB_GOOGLE_CLIENT_SECRET IHUB_PUBLIC_URL \
            IHUB_ALLOWED_EMAIL_DOMAIN IHUB_BOOTSTRAP_ADMINS IHUB_SMTP_HOST IHUB_SMTP_PORT \
            IHUB_SMTP_USERNAME IHUB_SMTP_PASSWORD IHUB_SMTP_FROM IHUB_SMTP_SSL; do
            value="${!name}"
            [ -n "$value" ] || continue
            API_AUTH_ENV+="            - name: $name"$'\n'
            API_AUTH_ENV+="              value: $(jq -Rn --arg v "$value" '$v')"$'\n'
          done
          export SERVICE REF SHORT_REF RUNTIME_SA DATA_TAG API_IMAGE WEB_IMAGE API_AUTH_ENV
          # Single quotes on purpose: envsubst replaces only the variables listed here.
          # The rendered file holds secrets: it stays in the runner's temporary folder and is
          # never printed or uploaded.
          # shellcheck disable=SC2016
          envsubst '${SERVICE} ${REF} ${SHORT_REF} ${DATA_TAG} ${RUNTIME_SA} ${API_IMAGE} ${WEB_IMAGE} ${API_AUTH_ENV}' \
            < deploy/service.yaml > "$RUNNER_TEMP/service.yaml"
          gcloud run services replace "$RUNNER_TEMP/service.yaml" --region "${{ vars.GCP_REGION }}" --quiet
          url="$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the app responds
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$url/health/ready" && curl -fsSL -o /dev/null "$url/overview"; then
              echo; echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
              echo "Commit \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "The app did not respond to the health check." >&2
          exit 1
